<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivio Punti Raccolta Sangue</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🩸 Archivio Punti Raccolta Sangue</h1>
            <p>Gestione punti di raccolta esterni nella regione</p>
        </header>

        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 Cerca per nome...">
            </div>
            <button class="btn btn-primary" id="addBtn">➕ Aggiungi Punto</button>
            <button class="btn btn-secondary" id="exportBtn">💾 Esporta Dati</button>
            <input type="file" id="importInput" accept=".json" style="display:none;">
            <button class="btn btn-secondary" id="importBtn">📂 Importa Dati</button>
        </div>

        <div id="puntiList" class="punti-grid"></div>

        <div class="empty-state" id="emptyState" style="display:none;">
            <p>Nessun punto di raccolta trovato</p>
            <button class="btn btn-primary" onclick="document.getElementById('addBtn').click()">Aggiungi il primo punto</button>
        </div>
    </div>

    <!-- Modal per Aggiungi/Modifica -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">Aggiungi Punto di Raccolta</h2>
            <form id="puntoForm">
                <div class="form-section">
                    <h3>Informazioni Base</h3>
                    <div class="form-group">
                        <label for="nome">Nome Punto di Raccolta *</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="form-group">
                        <label for="associazione">Associazione di Appartenenza *</label>
                        <input type="text" id="associazione" required>
                    </div>
                    <div class="form-group">
                        <label for="indirizzo">Indirizzo Completo *</label>
                        <input type="text" id="indirizzo" placeholder="Via, Città, CAP" required>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Attrezzature</h3>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="lettini">Numero Lettini *</label>
                            <input type="number" id="lettini" min="0" value="0" required>
                        </div>
                        <div class="form-group">
                            <label for="bilance">Numero Bilance *</label>
                            <input type="number" id="bilance" min="0" value="0" required>
                        </div>
                        <div class="form-group">
                            <label for="alimentatori">Numero Alimentatori *</label>
                            <input type="number" id="alimentatori" min="0" value="0" required>
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <h3>Archivio Fotografico</h3>
                    <div class="form-group">
                        <label for="fotoInput">Aggiungi Foto</label>
                        <input type="file" id="fotoInput" accept="image/*" multiple>
                    </div>
                    <div id="fotoPreview" class="foto-preview"></div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salva</button>
                    <button type="button" class="btn btn-secondary" id="cancelBtn">Annulla</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal Dettaglio -->
    <div id="detailModal" class="modal">
        <div class="modal-content modal-detail">
            <span class="close" id="closeDetail">&times;</span>
            <div id="detailContent"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
